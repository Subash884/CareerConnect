<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerConnect | Professional Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav id="navbar" class="hidden">
        <div class="logo">CareerConnect <span id="user-role-badge" style="font-size: 0.9rem; background: #e5e7eb; padding: 0.2rem 0.5rem; border-radius: 4px; color: #374151;"></span></div>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </nav>

    <div class="container">
        
        <div id="alert-box" class="hidden"></div>

        <div id="view-login" class="card" style="max-width: 400px; margin: 4rem auto;">
            <h2 style="text-align: center;">Welcome Back</h2>
            
            <div class="role-toggle">
                <div id="tab-seeker" class="role-btn active" onclick="switchLoginRole('SEEKER')">Job Seeker</div>
                <div id="tab-employer" class="role-btn" onclick="switchLoginRole('EMPLOYER')">Employer</div>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="login-email" placeholder="subash@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-password" value="Password123!">
            </div>
            <button class="btn-primary" onclick="login()">Authenticate</button>
        </div>

        <div id="view-seeker" class="hidden">
            <div class="card">
                <h3>Available Jobs</h3>
                <div id="public-jobs-container" class="grid-layout">
                    <p class="text-muted">Loading jobs...</p>
                </div>
            </div>

            <div class="card">
                <h3>My Application History</h3>
                <button class="btn-success" onclick="loadMyApplications()" style="width: auto; margin-bottom: 1rem;">Refresh My Applications</button>
                <div id="my-applications-container" class="grid-layout">
                    <p class="text-muted">Click refresh to view your applications.</p>
                </div>
            </div>
        </div>

        <div id="view-employer" class="hidden">
            <div class="card">
                <h3>Post a New Job</h3>
                <div class="form-group"><label>Job Title</label><input type="text" id="job-title" placeholder="e.g. Senior Java Developer"></div>
                <div class="form-group"><label>Company Name</label><input type="text" id="job-company" placeholder="e.g. Tech Corp"></div>
                <div class="form-group"><label>Location</label><input type="text" id="job-location" placeholder="e.g. Chennai, Tamil Nadu"></div>
                <div class="form-group"><label>Salary Range</label><input type="text" id="job-salary" placeholder="e.g. ₹8LPA - ₹12LPA"></div>
                <div class="form-group"><label>Description</label><textarea id="job-desc" rows="3" placeholder="Job requirements..."></textarea></div>
                <button class="btn-primary" onclick="postJob()">Publish Job Post</button>
            </div>

            <div class="card">
                <h3>Check Applicants</h3>
                <p style="font-size: 0.875rem; color: var(--text-muted); margin-bottom: 1rem;">Enter the ID of your job post to see who applied.</p>
                <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
                    <input type="number" id="check-job-id" placeholder="Job ID (e.g. 1)" style="width: 150px;">
                    <button class="btn-success" onclick="checkApplicants()" style="width: auto;">Fetch Applicants</button>
                </div>
                <div id="applicants-container"></div>
            </div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
