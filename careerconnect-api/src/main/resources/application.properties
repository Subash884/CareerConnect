spring.application.name=careerconnect-api

# ===============================
# SERVER PORT
# ===============================
server.port=8080

# ===============================
# MYSQL DATABASE CONFIGURATION
# ===============================
# Update 'careerconnect_db' if you named your MySQL database something else
# ===============================
# MYSQL DATABASE CONFIGURATION
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/careerconnect_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Eagle@123

# ===============================
# JPA / HIBERNATE SETTINGS
# ===============================
# 'update' automatically creates/updates tables based on your Entity classes
spring.jpa.hibernate.ddl-auto=update
# Shows the SQL queries in the console (helpful for debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# JWT CONFIGURATION
# ===============================
# A 256-bit Hex String used to sign the tokens securely
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Token expiration time in milliseconds (86400000 ms = 24 hours)
jwt.expiration=86400000